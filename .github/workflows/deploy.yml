name: Deploy to Production Server

# ============================================================
# Vet-AI 自动化部署工作流
# 触发条件: 推送到 langgraph/main/master 分支或手动触发
# ============================================================

on:
  push:
    branches:
      - main
      - master
      - langgraph
  workflow_dispatch:  # 支持手动触发

jobs:
  # ================== 部署到服务器 ==================
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/langgraph'

    steps:
      - name: 📥 Checkout代码
        uses: actions/checkout@v4

      - name: 🔐 安装 SSH 工具
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

      - name: 📦 准备服务器目录
        run: |
          echo "正在创建服务器目录..."
          sshpass -p "${{ secrets.SERVER_PASSWORD }}" ssh \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            'sudo mkdir -p /opt/vet-ai && sudo chown $(whoami):$(whoami) /opt/vet-ai'

      - name: 📦 复制文件到服务器
        run: |
          echo "正在复制文件到服务器..."
          sshpass -p "${{ secrets.SERVER_PASSWORD }}" scp -r \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            docker/ backend/ config/ core/ utils/ \
            pyproject.toml uv.lock requirements.txt \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/opt/vet-ai/

      - name: 🚀 部署应用
        run: |
          echo "正在部署应用到服务器..."
          sshpass -p "${{ secrets.SERVER_PASSWORD }}" ssh \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'ENDSSH'
          set -e

          echo "=== 进入部署目录 ==="
          cd /opt/vet-ai/docker

          echo "=== 停止旧服务 ==="
          docker-compose -f docker-compose.cn.yml down || docker-compose down

          echo "=== 清理旧镜像 ==="
          docker image prune -f || true

          echo "=== 构建新镜像 ==="
          docker-compose -f docker-compose.cn.yml build --no-cache

          echo "=== 启动新服务 ==="
          docker-compose -f docker-compose.cn.yml up -d

          echo "=== 等待服务就绪 ==="
          sleep 15

          echo "=== 检查服务状态 ==="
          docker-compose -f docker-compose.cn.yml ps
          docker-compose -f docker-compose.cn.yml logs --tail=50 vet-ai

          echo "=== 健康检查 ==="
          if curl -sf http://localhost:8080/health > /dev/null; then
            echo "✅ 服务部署成功！"
          else
            echo "❌ 服务部署失败！"
            docker-compose -f docker-compose.cn.yml logs vet-ai
            exit 1
          fi
          ENDSSH

      - name: 🧪 测试部署
        run: |
          echo "正在测试部署..."
          sshpass -p "${{ secrets.SERVER_PASSWORD }}" ssh \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "curl -f http://localhost:8080/health || exit 1"

      - name: 📊 部署报告
        if: success()
        run: |
          echo "## 🎉 部署成功！" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**部署时间**: $(date)" >> $GITHUB_STEP_SUMMARY
          echo "**提交SHA**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**提交消息**: ${{ github.event.head_commit.message }}" >> $GITHUB_STEP_SUMMARY
          echo "**服务器**: ${{ secrets.SERVER_HOST }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📋 服务状态" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          sshpass -p "${{ secrets.SERVER_PASSWORD }}" ssh \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "docker-compose -f /opt/vet-ai/docker/docker-compose.cn.yml ps" >> $GITHUB_STEP_SUMMARY 2>&1 || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: ❌ 部署失败通知
        if: failure()
        run: |
          echo "## ❌ 部署失败！" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "请检查服务器日志：" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" >> $GITHUB_STEP_SUMMARY
          echo "cd /opt/vet-ai/docker" >> $GITHUB_STEP_SUMMARY
          echo "docker-compose -f docker-compose.cn.yml logs --tail=100 vet-ai" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
