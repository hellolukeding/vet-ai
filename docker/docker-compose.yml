# ============================================================
# Vet-AI Docker Compose 配置（轻量化部署）
# ============================================================

services:
  # ================== Redis 服务 ==================
  redis:
    image: redis:7-alpine
    container_name: vet-ai-redis
    ports:
      - "16379:6379"
    restart: unless-stopped
    # 资源限制
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M
    # 健康检查
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    # 日志配置
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # ================== 主应用服务 ==================
  vet-ai:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: vet-ai-backend
    env_file:
      - .env
    ports:
      - "18082:8080"
    environment:
      # Python环境
      - PYTHONUNBUFFERED=1
      - ENVIRONMENT=production
      # 日志级别
      - LOG_LEVEL=INFO
      # API配置
      - HOST=0.0.0.0
      - PORT=8080
      # Redis配置
      - REDIS_URL=redis://redis:6379/0
      # CORS配置
      - ALLOWED_HOSTS=["*"]
      - CORS_ALLOW_CREDENTIALS=true
      - CORS_ALLOW_METHODS=["GET","POST","PUT","DELETE","OPTIONS"]
      - CORS_ALLOW_HEADERS=["*"]
      - CORS_EXPOSE_HEADERS=["*"]
      # 调试模式（生产环境设为false）
      - DEBUG=false
      # API文档访问控制（生产环境也可设为true以查看文档）
      - ENABLE_DOCS=true
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    # 资源限制（轻量化部署）
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M
    # 健康检查
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # 日志配置
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  default:
    name: vet-ai-network
