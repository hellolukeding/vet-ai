name: Deploy - 自动部署

on:
  push:
    branches: [main, langgraph]
  workflow_dispatch:

concurrency:
  group: production-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: 部署到服务器
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SERVER_HOST_RAW: ${{ secrets.SERVER_HOST }}
      SERVER_USER_RAW: ${{ secrets.SERVER_USER }}
      SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
      API_KEY: ${{ secrets.API_KEY }}
      MODEL_NAME: ${{ vars.MODEL_NAME }}
      BASE_URL: ${{ vars.BASE_URL }}
      SERVER_PORT: ${{ vars.SERVER_PORT }}
      APT_MIRROR: https://mirrors.cloud.tencent.com/debian

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装依赖
        run: |
          echo "安装 sshpass..."
          sudo apt-get update
          sudo apt-get install -y sshpass rsync

      - name: 执行部署
        run: |
          bash scripts/github-deploy.sh
