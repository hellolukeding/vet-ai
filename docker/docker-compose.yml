version: "3.8"

services:
  vet-ai-backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: vet-ai-backend
    ports:
      - "18082:8080"
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
      - ./runs:/app/runs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
