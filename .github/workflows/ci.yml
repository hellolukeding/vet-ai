name: CI - 代码检查与测试

on:
  push:
    branches: [ main, langgraph, develop ]
  pull_request:
    branches: [ main, langgraph ]

jobs:
  # ================== 代码质量检查 ==================
  lint:
    name: 代码质量检查
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置Python环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.15.7 mypy pytest pytest-asyncio

      - name: 运行 Ruff 代码检查
        run: |
          ruff check backend/ core/ utils/ config/ --output-format=github

      - name: 运行 Ruff 格式化检查
        run: |
          ruff format --check backend/ core/ utils/ config/

  # ================== 类型检查 ==================
  type-check:
    name: Python类型检查
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置Python环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install mypy
          pip install -r requirements.txt 2>/dev/null || echo "部分依赖安装失败，继续..."

      - name: 运行 MyPy 类型检查
        run: |
          mypy backend/ core/ --ignore-missing-imports --no-error-summary || true

  # ================== 单元测试 ==================
  test:
    name: 单元测试
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置Python环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 运行单元测试
        run: |
          pytest -q

  # ================== Docker 构建测试 ==================
  docker-build:
    name: Docker镜像构建测试
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 构建 Docker 镜像
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          push: false
          load: true
          tags: vet-ai:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 测试 Docker 镜像启动
        run: |
          docker run -d --name test-container -p 8080:8080 vet-ai:test
          sleep 10
          curl -f http://localhost:8080/health || exit 1
          docker stop test-container
