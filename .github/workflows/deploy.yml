name: Deploy to Production Server

# ============================================================
# Vet-AI 自动化部署工作流（使用 SSH 密钥认证）
# 触发条件: 推送到 langgraph/main/master 分支或手动触发
# ============================================================

on:
  push:
    branches:
      - main
      - master
      - langgraph
  workflow_dispatch:  # 支持手动触发

jobs:
  # ================== 部署到服务器 ==================
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/langgraph'

    steps:
      - name: 📥 Checkout代码
        uses: actions/checkout@v4

      - name: 🔐 配置 SSH 密钥
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: 📦 测试 SSH 连接
        run: |
          ssh -o StrictHostKeyChecking=no \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "echo 'SSH连接成功' && whoami && pwd && ls -la /opt/vet-ai/"

      - name: 🚀 部署应用（使用 rsync + SSH）
        run: |
          echo "正在同步文件..."
          rsync -avz --delete \
            -e "ssh -o StrictHostKeyChecking=no" \
            docker/ backend/ config/ core/ utils/ \
            pyproject.toml uv.lock requirements.txt \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/opt/vet-ai/

          echo "正在部署应用..."
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'ENDSSH'
          set -e

          cd /opt/vet-ai/docker

          echo "=== 停止旧服务 ==="
          docker-compose -f docker-compose.cn.yml down || true

          echo "=== 清理旧镜像 ==="
          docker image prune -f || true

          echo "=== 构建新镜像 ==="
          docker-compose -f docker-compose.cn.yml build --no-cache

          echo "=== 启动新服务 ==="
          docker-compose -f docker-compose.cn.yml up -d

          echo "=== 等待服务就绪 ==="
          sleep 15

          echo "=== 检查服务状态 ==="
          docker-compose -f docker-compose.cn.yml ps
          docker-compose -f docker-compose.cn.yml logs --tail=50 vet-ai

          echo "=== 健康检查 ==="
          if curl -sf http://localhost:8080/health > /dev/null; then
            echo "✅ 服务部署成功！"
          else
            echo "❌ 服务部署失败！"
            docker-compose -f docker-compose.cn.yml logs vet-ai
            exit 1
          fi
          ENDSSH

      - name: 🧪 测试部署
        run: |
          ssh -o StrictHostKeyChecking=no \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "curl -f http://localhost:8080/health || exit 1"

      - name: 📊 部署报告
        if: success()
        run: |
          echo "## 🎉 部署成功！" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**部署时间**: $(date)" >> $GITHUB_STEP_SUMMARY
          echo "**提交SHA**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**提交消息**: ${{ github.event.head_commit.message }}" >> $GITHUB_STEP_SUMMARY
          echo "**服务器**: ${{ secrets.SERVER_HOST }}" >> $GITHUB_STEP_SUMMARY

      - name: ❌ 部署失败通知
        if: failure()
        run: |
          echo "## ❌ 部署失败！" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "请检查服务器日志" >> $GITHUB_STEP_SUMMARY
