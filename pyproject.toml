[project]
name = "pet-doctor"
version = "0.1.0"
description = "AI-powered pet health diagnostic API"
authors = [
    { name = "Luke Ding", email = "lukeding@gmail.com" }
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "numpy",
    "python-dotenv>=1.1.1",
    "agentscope (<0.2.0)",
    "loguru>=0.6.0",
    "langchain-openai>=0.1.0",
    "langgraph>=0.2.0",
    "beautifulsoup4",
    "requests",
    "pydantic-settings>=2.10.1",
    "pytest>=8.4.1",
    "pandas>=2.3.1",
    "redis>=7.0.1",
    "lxml (>=6.0.2,<7.0.0)",
]

[project.optional-dependencies]
dev = [
    "black",
    "ruff",
    "pytest",
    "httpx"
]

[tool.uv]  # uv 自定义配置（可省略，uv 会自动解析）

[tool.black]
line-length = 88
target-version = ['py39']

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.pytest.ini_options]
addopts = "-ra -q"
testpaths = ["tests"]

[project.scripts]
# Console script to start the FastAPI application. Installs a `run-server` entry
# that calls the `main` function in `backend.api` (which launches uvicorn).
start_server = "backend.api:main"
