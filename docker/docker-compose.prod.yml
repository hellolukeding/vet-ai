version: "3.8"

# 生产环境 Docker Compose 配置
# 包含更严格的安全设置和性能优化

services:
  vet-ai-backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: vet-ai-backend
    ports:
      - "127.0.0.1:8080:8080" # 只允许本地访问
    env_file:
      - .env
    volumes:
      - app_logs:/app/logs
      - app_runs:/app/runs
    networks:
      - vet-ai-network
    restart: unless-stopped
    depends_on:
      - mongo
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import requests; requests.get('http://localhost:8080/health')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  mongo:
    image: mongo:5.0
    container_name: vet-ai-mongo
    ports:
      - "127.0.0.1:27017:27017" # 只允许本地访问
    env_file:
      - .env
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
      - ./mongo-init:/docker-entrypoint-initdb.d:ro
    networks:
      - vet-ai-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    command: mongod --auth --bind_ip_all

  nginx:
    image: nginx:alpine
    container_name: vet-ai-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    networks:
      - vet-ai-network
    depends_on:
      - vet-ai-backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 监控服务 (可选)
  watchtower:
    image: containrrr/watchtower
    container_name: vet-ai-watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 3600 --cleanup
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  vet-ai-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  mongo_data:
    driver: local
  mongo_config:
    driver: local
  app_logs:
    driver: local
  app_runs:
    driver: local
  nginx_logs:
    driver: local
