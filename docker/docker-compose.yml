version: "3.8"

services:
  vet-ai-backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: vet-ai-backend
    ports:
      - "18082:8080"
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
      - ./runs:/app/runs
    restart: unless-stopped
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  redis:
    image: redis:7-alpine
    container_name: vet-ai-redis
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    command: redis-server --appendonly yes

volumes:
  redis_data:
    driver: local
