version: "3.8"

services:
  vet-ai-backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: vet-ai-backend
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
      - ./runs:/app/runs
    networks:
      - vet-ai-network
    restart: unless-stopped
    depends_on:
      - mongo
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  mongo:
    image: mongo:5.0
    container_name: vet-ai-mongo
    ports:
      - "27017:27017"
    env_file:
      - .env
    volumes:
      - mongo_data:/data/db
      - ./docker/mongo-init:/docker-entrypoint-initdb.d
    networks:
      - vet-ai-network
    restart: unless-stopped

  # Nginx反向代理 (可选)
  nginx:
    image: nginx:alpine
    container_name: vet-ai-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    networks:
      - vet-ai-network
    depends_on:
      - vet-ai-backend
    restart: unless-stopped

networks:
  vet-ai-network:
    driver: bridge

volumes:
  mongo_data:
    driver: local
