name: Deploy to Production Server

# ============================================================
# Vet-AI 自动化部署工作流（使用密码认证，git pull 方式）
# 触发条件: 推送到 langgraph/main/master 分支或手动触发
# ============================================================

on:
  push:
    branches:
      - main
      - master
      - langgraph
  workflow_dispatch:  # 支持手动触发

jobs:
  # ================== 部署到服务器 ==================
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/langgraph'

    steps:
      - name: 📥 Checkout代码
        uses: actions/checkout@v4

      - name: 🔐 安装 SSH 工具
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

      - name: 🚀 部署应用（git pull 方式）
        run: |
          sshpass -p "${{ secrets.SERVER_PASSWORD }}" ssh \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "bash -s" << 'ENDSSH'
          set -e

          echo "=== 进入部署目录 ==="
          cd /opt/vet-ai

          echo "=== 初始化/更新 git 仓库 ==="
          if [ -d .git ]; then
            echo "仓库已存在，拉取最新代码"
            git fetch --all
            git reset --hard origin/langgraph
            git pull origin langgraph
          else
            echo "首次部署，克隆仓库"
            git clone https://github.com/hellolukeding/vet-ai.git temp_repo
            mv temp_repo/.git .
            rm -rf temp_repo
            git checkout langgraph
          fi

          echo "=== 当前目录内容 ==="
          ls -la

          echo "=== 配置 Docker 镜像加速器 ==="
          sudo mkdir -p /etc/docker

          if [ -f /etc/docker/daemon.json ]; then
            sudo cp /etc/docker/daemon.json /etc/docker/daemon.json.bak
          fi

          sudo bash -c 'cat > /etc/docker/daemon.json << "DOCKEREOF"
{
  "registry-mirrors": [
    "https://docker.m.daocloud.io",
    "https://docker.1panel.live",
    "https://docker.anyhub.us.kg",
    "https://dockerhub.icu"
  ],
  "max-concurrent-downloads": 10
}
DOCKEREOF'

          sudo systemctl daemon-reload
          sudo systemctl restart docker
          sleep 5

          echo "=== 验证 Docker 配置 ==="
          docker info | grep -A 10 "Registry Mirrors" || echo "警告：镜像加速器未生效"
          echo "=== Docker 镜像加速器配置完成 ==="

          echo "=== 进入 docker 目录 ==="
          cd docker

          echo "=== 停止旧服务 ==="
          docker-compose -f docker-compose.cn.yml down || true

          echo "=== 清理旧镜像 ==="
          docker image prune -f || true

          echo "=== 预拉取基础镜像 ==="
          docker pull python:3.12-slim || echo "镜像拉取失败，将尝试在构建时拉取"

          echo "=== 构建新镜像 ==="
          docker-compose -f docker-compose.cn.yml build --no-cache

          echo "=== 启动新服务 ==="
          docker-compose -f docker-compose.cn.yml up -d

          echo "=== 等待服务就绪 ==="
          sleep 15

          echo "=== 检查服务状态 ==="
          docker-compose -f docker-compose.cn.yml ps
          docker-compose -f docker-compose.cn.yml logs --tail=50 vet-ai

          echo "=== 健康检查 ==="
          if curl -sf http://localhost:8080/health > /dev/null; then
            echo "✅ 服务部署成功！"
          else
            echo "❌ 服务部署失败！"
            docker-compose -f docker-compose.cn.yml logs vet-ai
            exit 1
          fi
          ENDSSH

      - name: 📊 部署报告
        if: success()
        run: |
          echo "## 🎉 部署成功！" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**部署时间**: $(date)" >> $GITHUB_STEP_SUMMARY
          echo "**提交SHA**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**提交消息**: ${{ github.event.head_commit.message }}" >> $GITHUB_STEP_SUMMARY
          echo "**服务器**: ${{ secrets.SERVER_HOST }}" >> $GITHUB_STEP_SUMMARY

      - name: ❌ 部署失败通知
        if: failure()
        run: |
          echo "## ❌ 部署失败！" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "请检查服务器日志：" >> $GITHUB_STEP_SUMMARY
